name: Full CI with SQL Server and Playwright
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          SA_PASSWORD: "Kimtho@123"
          ACCEPT_EULA: "Y"
        ports:
          - 1433:1433

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install serve globally
        run: npm install -g serve

      - name: Install sqlcmd tools
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          sudo apt-add-repository "$(wget -qO- https://packages.microsoft.com/config/ubuntu/20.04/prod.list)"
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools unixodbc-dev
          echo "/opt/mssql-tools/bin" >> $GITHUB_PATH

      - name: Wait for SQL Server ready
        run: |
          for i in {1..20}; do
            sqlcmd -S localhost -U sa -P "Kimtho@123" -Q "SELECT 1" && break
            echo "Waiting for SQL Server..."
            sleep 5
          done

      - name: Create database and import SQL scripts
        run: |
          sqlcmd -S localhost -U sa -P "Kimtho@123" -Q "CREATE DATABASE Sports"
          sqlcmd -S localhost -U sa -P "Kimtho@123" -d Sports -i SQL/CREATE_TABLE.sql
          sqlcmd -S localhost -U sa -P "Kimtho@123" -d Sports -i SQL/DATN.sql
          sqlcmd -S localhost -U sa -P "Kimtho@123" -d Sports -i SQL/CONTRAINT.sql
      - name: Wait for data availability
        run: |
          echo "Checking if ChatLieu table has data..."
          for i in {1..20}; do
            COUNT=$(sqlcmd -S localhost -U sa -P "Kimtho@123" -d Sports -h -1 -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM ChatLieu")
            echo "Row count: $COUNT"
            if [ "$COUNT" -gt 0 ]; then echo "Data ready"; break; fi
            sleep 3
          done
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build Backend
        working-directory: Back-end
        run: mvn clean install

      - name: Start Backend
        working-directory: Back-end
        env:
          SPRING_PROFILES_ACTIVE: ci
        run: |
          nohup mvn spring-boot:run -Dspring-boot.run.profiles=ci > ../backend.log 2>&1 &

      - name: Print backend log (after 10s)
        run: |
          sleep 10
          cat backend.log || echo "No backend log"

      - name: Install frontend dependencies
        working-directory: Front-end
        run: npm install --legacy-peer-deps --force

      - name: Build frontend
        working-directory: Front-end
        run: CI='' GENERATE_SOURCEMAP=false npm run build

      - name: Start frontend
        working-directory: Front-end
        run: nohup serve -s build -l 3000 > ../frontend.log 2>&1 &

      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 180000

      - name: Wait for backend API ready
        run: npx wait-on http://localhost:8080/api/chatlieu/hienthi --timeout 300000


      - name: Install Playwright test dependencies
        working-directory: Test_project
        run: npm ci

      - name: Install Playwright browsers
        working-directory: Test_project
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: Test_project
        run: |
          npx playwright test

      - name: Debug report folder contents
        if: always()
        working-directory: Test_project
        run: ls -R test-reports


      - name: Print backend log on failure
        if: failure()
        run: cat backend.log || echo "No backend log"

      - name: Print frontend log on failure
        if: failure()
        run: cat frontend.log || echo "No frontend log"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Test_project/test-reports/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Playwright trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: Test_project/test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload Playwright JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-report
          path: Test_project/report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Parse failed tests and send Jira bugs
        if: always()
        working-directory: Test_project
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
        run: |
            REPORT_PATH="./report.json"
            if [ ! -f "$REPORT_PATH" ]; then
              echo "❌ Không tìm thấy report.json. Bỏ qua gửi Jira."
              exit 0
            fi
            
            # ✅ Lấy lần chạy cuối (sau retry), lấy projectName từ test, không bị trùng
            TESTS=$(jq -c '
              .suites[]?.suites[]?.specs[]? as $spec |
              $spec.tests[]? as $test |
              ($test.results | last) as $result |
              select($result.status == "failed") |
              {
                name: ($test.title | join(" › ")),
                file: $spec.file,
                browser: ($test.projectName // "unknown-browser"),
                video: (($result.attachments // []) | map(select(.name == "video")) | .[0].path // empty)
              }
            ' "$REPORT_PATH")
            
            if [ -z "$TESTS" ]; then
              echo "✅ Không có lỗi nào cần gửi Jira."
              exit 0
            fi
            
            echo "$TESTS" | while IFS= read -r test; do
              NAME=$(echo "$test" | jq -r '.name // "unknown-test"')
              FILE=$(echo "$test" | jq -r '.file // "unknown-file"')
              BROWSER=$(echo "$test" | jq -r '.browser // "unknown-browser"')
              VIDEO_PATH=$(echo "$test" | jq -r '.video // empty')
            
              SUMMARY="❌ Test Fail: $NAME [$BROWSER]"
            
              PAYLOAD=$(jq -n \
                --arg summary "$SUMMARY" \
                --arg project "$JIRA_PROJECT_KEY" \
                --arg name "$NAME" \
                --arg file "$FILE" \
                --arg browser "$BROWSER" \
                --arg repo "${{ github.repository }}" \
                --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '
                {
                  fields: {
                    project: { key: $project },
                    summary: $summary,
                    description: {
                      type: "doc",
                      version: 1,
                      content: [
                        {
                          type: "paragraph",
                          content: [
                            { type: "text", text: "❌ Chức năng lỗi: " },
                            { type: "text", text: $name, marks: [{ type: "strong" }] }
                          ]
                        },
                        {
                          type: "paragraph",
                          content: [
                            { type: "text", text: "• Trình duyệt: " },
                            { type: "text", text: $browser }
                          ]
                        },
                        {
                          type: "paragraph",
                          content: [
                            { type: "text", text: "• File: " },
                            { type: "text", text: $file, marks: [{ type: "code" }] }
                          ]
                        },
                        {
                          type: "paragraph",
                          content: [
                            { type: "text", text: "• Repo: " },
                            { type: "text", text: $repo }
                          ]
                        },
                        {
                          type: "paragraph",
                          content: [
                            { type: "text", text: "• CI Run: " },
                            { type: "text", text: $run_url }
                          ]
                        },
                        {
                          type: "paragraph",
                          content: [
                            { type: "text", text: "👉 Xem thêm HTML report và trace file trong GitHub artifacts." }
                          ]
                        }
                      ]
                    },
                    issuetype: { name: "Bug" }
                  }
                }
              ')
            
              RESPONSE=$(curl -s -w "%{http_code}" -o response.json -X POST \
                -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "$PAYLOAD" \
                "$JIRA_BASE_URL/rest/api/3/issue/")
            
              if [ "$RESPONSE" = "201" ]; then
                KEY=$(jq -r '.key' response.json)
                echo "✅ Đã tạo Jira bug: $KEY"
            
                # 📎 Gửi video nếu có
                if [ -n "$VIDEO_PATH" ] && [ -f "$VIDEO_PATH" ]; then
                  echo "📎 Đính kèm video: $VIDEO_PATH"
                  curl -s -X POST \
                    -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
                    -H "X-Atlassian-Token: no-check" \
                    -F "file=@$VIDEO_PATH" \
                    "$JIRA_BASE_URL/rest/api/3/issue/$KEY/attachments"
                else
                  echo "⚠️ Không tìm thấy video cho: $NAME"
                fi
            
              else
                echo "⚠️ Gửi lỗi Jira thất bại (HTTP $RESPONSE):"
                cat response.json
              fi
            done
